# Fly.io settings. Change `app` to a name nobody else uses, then follow docs/DEPLOY.md.
app = "gasora-CHANGE-ME"
primary_region = "sin"            # Singapore is the closest Fly region to Pakistan; "fra" and "bom" are other options

[build]

[env]
  GASORA_ENV = "production"

[mounts]
  source = "gasora_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # a stopped machine would stop the daily backups and cold-start the first user
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"               # the route optimiser needs more than the smallest 256 MB size
